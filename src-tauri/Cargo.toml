[package]
name = "vetcord"
version = "0.5.0"
description = "VetCord - a lightweight, open-source Discord client"
edition = "2021"
license = "MIT"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
